<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DroneZoom — auto-zoom & smooth your rides</title>
  <style>
    :root {
      --bg: #111418;
      --panel: #1a1f26;
      --border: #2a323d;
      --text: #e6ebf0;
      --muted: #8b97a5;
      --accent: #35c4a2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    header h1 { font-size: 18px; margin: 0; }
    header span { color: var(--muted); font-size: 13px; }
    main { padding: 16px 20px; max-width: 1400px; margin: 0 auto; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 14px;
    }
    .controls label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
    .controls input[type="range"] { width: 130px; accent-color: var(--accent); }
    button {
      background: var(--accent);
      color: #07221b;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { background: #2a323d; color: var(--muted); cursor: default; }
    button.secondary { background: #2a323d; color: var(--text); }
    #status { font-size: 13px; color: var(--muted); margin: 0 0 12px; min-height: 18px; }
    #status.error { color: #ff7b72; }
    progress { width: 100%; height: 6px; margin-bottom: 14px; accent-color: var(--accent); }
    .views { display: flex; gap: 14px; flex-wrap: wrap; }
    .view { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
    .view h2 { font-size: 13px; color: var(--muted); margin: 0 0 8px; font-weight: 500; }
    canvas { display: block; border-radius: 4px; background: #000; max-width: 100%; }
    #originalCanvas { width: 420px; }
    #previewCanvas { width: 840px; }
    video { display: none; }
    .value { color: var(--text); min-width: 36px; display: inline-block; }
  </style>
</head>
<body>
  <header>
    <h1>DroneZoom</h1>
    <span>auto-zoom &amp; stabilize drone footage — milestone 1: detect → smooth → preview</span>
  </header>
  <main>
    <div class="controls">
      <input type="file" id="fileInput" accept="video/mp4,video/quicktime,video/*" />
      <button id="analyzeBtn" disabled>Analyze clip</button>
      <label>Sample every
        <select id="strideSel">
          <option value="0.1">0.1 s</option>
          <option value="0.2" selected>0.2 s</option>
          <option value="0.5">0.5 s</option>
        </select>
      </label>
      <label>Framing tightness <input type="range" id="padSlider" min="2" max="10" step="0.5" value="5" />
        <span class="value" id="padValue">5.0×</span></label>
      <label>Camera smoothness <input type="range" id="smoothSlider" min="0.2" max="3" step="0.1" value="1.0" />
        <span class="value" id="smoothValue">1.0s</span></label>
      <label><input type="checkbox" id="showBoxes" checked /> show detections</label>
      <button id="playBtn" class="secondary" disabled>Play</button>
      <button id="exportBtn" disabled title="Milestone 2: WebCodecs export">Export (soon)</button>
    </div>
    <p id="status">Loading detector…</p>
    <progress id="progressBar" value="0" max="1" hidden></progress>
    <div class="views">
      <div class="view">
        <h2>Original + tracking</h2>
        <canvas id="originalCanvas"></canvas>
      </div>
      <div class="view">
        <h2>Auto-zoomed preview</h2>
        <canvas id="previewCanvas"></canvas>
      </div>
    </div>
    <video id="video" playsinline muted></video>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
